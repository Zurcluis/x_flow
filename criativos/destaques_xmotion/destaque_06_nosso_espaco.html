<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <title>Nosso Espaço</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
  body {
    width: 1080px;
    height: 1920px;
    background: #101211;
    color: #f2f2ee;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .ambient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(197, 170, 121, 0.085) 0%, rgba(23, 26, 24, 0.55) 36%, #101211 70%);
  }
  /* Subtle vertical hairline below top logo and around footer */
  .axis-v {
    position: absolute;
    top: 290px;
    bottom: 290px;
    left: 50%;
    width: 1px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.09), transparent 22%, transparent 78%, rgba(255,255,255,0.09));
  }
  .top-brand {
    position: absolute;
    top: 112px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .top-brand img {
    height: 112px;
    width: auto;
    display: block;
  }
  .top-brand-sub {
    font-size: 13px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #8c9485;
    font-weight: 400;
  }

  /* Center Circle Emblem (stays cleanly centered inside 1080x1080 crop) */
  .center-stage {
    position: relative;
    z-index: 10;
    width: 780px;
    height: 780px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ring-outer {
    position: absolute;
    inset: 28px;
    border-radius: 50%;
    border: 1.5px solid rgba(197, 170, 121, 0.22);
    background: radial-gradient(circle at 50% 35%, rgba(28, 31, 29, 0.72) 0%, rgba(16, 18, 17, 0.96) 78%);
  }
  .ring-inner {
    position: absolute;
    inset: 92px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .icon-box {
    position: relative;
    z-index: 20;
    width: 440px;
    height: 440px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Full-screen Story Footer (visible if someone opens cover inside highlight, cropped cleanly out of thumbnail) */
  .bottom-meta {
    position: absolute;
    bottom: 150px;
    z-index: 10;
    text-align: center;
  }
  .bottom-index {
    font-size: 14px;
    letter-spacing: 0.24em;
    color: #c5aa79;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .bottom-title {
    font-size: 44px;
    font-weight: 300;
    letter-spacing: -0.04em;
    color: #f2f2ee;
    margin-bottom: 10px;
  }
  .bottom-sub {
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8c9485;
  }
</style>
</head>
